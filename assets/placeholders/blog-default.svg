<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="defBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="50%" stop-color="#071728"/>
      <stop offset="100%" stop-color="#061c14"/>
    </linearGradient>
    <linearGradient id="defGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a651"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="defGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00a651" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00a651" stop-opacity="0"/>
    </radialGradient>
    <pattern id="defGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.035"/>
      <circle cx="40" cy="40" r="1.5" fill="#00a651" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#defBg)"/>
  <rect width="1200" height="630" fill="url(#defGlow)"/>
  <rect width="1200" height="630" fill="url(#defGrid)"/>

  <!-- Right Graphic: Abstract TechBound Logo Shield -->
  <g transform="translate(860, 140)">
    <rect x="0" y="0" width="170" height="170" rx="36" fill="#0b242e" stroke="#00a651" stroke-width="2" stroke-opacity="0.6"/>
    <!-- TB emblem inside -->
    <path d="M45,50 L125,50 M85,50 L85,125" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
    <path d="M70,85 C95,75 115,90 105,110 C95,125 70,125 65,115" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="125" cy="50" r="6" fill="#00a651"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(100, 150)">
    <!-- Pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#00a651" fill-opacity="0.18" stroke="#00a651" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#00a651"/>
    <text x="35" y="24" fill="#34d399" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">TECHBOUND INSIGHTS</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Digital Marketing &amp;
    </text>
    <text x="0" y="150" fill="url(#defGrad)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Tech Innovation
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Strategic insights and actionable guides from the TechBound team
    </text>

    <!-- Signature Bar -->
    <line x1="0" y1="270" x2="480" y2="270" stroke="#1e293b" stroke-width="2"/>
    <g transform="translate(0, 290)">
      <text x="0" y="18" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">TECHBOUND</text>
      <text x="125" y="18" fill="#00a651" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600">INNOVATIONS</text>
      <text x="260" y="18" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">techbound.in</text>
    </g>
  </g>
</svg>
