<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#061a14"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a651"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00a651" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00a651" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>
      <circle cx="40" cy="40" r="1.5" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative Abstract Shapes -->
  <g opacity="0.4" stroke="url(#brandGrad)" stroke-width="1.5" fill="none">
    <circle cx="950" cy="220" r="160" stroke-dasharray="8 6"/>
    <circle cx="950" cy="220" r="230" stroke-dasharray="4 8" opacity="0.5"/>
    <circle cx="950" cy="220" r="80"/>
    <path d="M780,220 L1120,220 M950,50 L950,390" stroke-opacity="0.3"/>
  </g>

  <!-- Center-Right Tech Graphic: Digital Hub -->
  <g transform="translate(870, 140)">
    <!-- Central Icon Card -->
    <rect x="0" y="0" width="160" height="160" rx="32" fill="#0c2333" stroke="#00a651" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Rocket / Growth Icon -->
    <path d="M80,35 C95,50 115,85 110,105 C100,108 90,102 80,95 C70,102 60,108 50,105 C45,85 65,50 80,35 Z" fill="url(#brandGrad)"/>
    <circle cx="80" cy="65" r="7" fill="#07111e"/>
    <path d="M62,98 L50,118 L70,112 Z" fill="#2dd4bf"/>
    <path d="M98,98 L110,118 L90,112 Z" fill="#2dd4bf"/>
    <path d="M75,115 L80,128 L85,115 Z" fill="#f59e0b"/>
  </g>

  <!-- Brand Card on Left -->
  <g transform="translate(100, 150)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#00a651" fill-opacity="0.18" stroke="#00a651" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#00a651"/>
    <text x="35" y="24" fill="#34d399" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">TECHBOUND INSIGHTS</text>

    <!-- Main Title Banner -->
    <text x="0" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Digital Marketing
    </text>
    <text x="0" y="150" fill="url(#brandGrad)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      &amp; Growth Strategy
    </text>

    <!-- Subtitle / Meta -->
    <text x="0" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Proven tactics, analytics &amp; modern digital transformation
    </text>

    <!-- Brand Signature Bar -->
    <line x1="0" y1="270" x2="480" y2="270" stroke="#1e293b" stroke-width="2"/>
    <g transform="translate(0, 290)">
      <text x="0" y="18" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">TECHBOUND</text>
      <text x="125" y="18" fill="#00a651" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600">INNOVATIONS</text>
      <text x="260" y="18" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">techbound.in</text>
    </g>
  </g>
</svg>
