<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="seoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051410"/>
      <stop offset="50%" stop-color="#0a1e1b"/>
      <stop offset="100%" stop-color="#0a1829"/>
    </linearGradient>
    <linearGradient id="seoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="seoGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="seoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.035"/>
      <circle cx="40" cy="40" r="1.5" fill="#10b981" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#seoBg)"/>
  <rect width="1200" height="630" fill="url(#seoGlow)"/>
  <rect width="1200" height="630" fill="url(#seoGrid)"/>

  <!-- Right Graphic: Search Lens & Ranking Graph -->
  <g transform="translate(860, 140)">
    <!-- Search Bar Card -->
    <rect x="-40" y="20" width="280" height="54" rx="27" fill="#0d2822" stroke="#10b981" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="-10" cy="47" r="12" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <line x1="-1" y1="56" x2="8" y2="65" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="25" y="42" width="140" height="10" rx="5" fill="#34d399" fill-opacity="0.3"/>
    <circle cx="215" cy="47" r="12" fill="#10b981"/>

    <!-- Ranking Growth Bars -->
    <g transform="translate(0, 110)">
      <rect x="0" y="70" width="32" height="60" rx="8" fill="#1e3a34"/>
      <rect x="46" y="45" width="32" height="85" rx="8" fill="#1e3a34"/>
      <rect x="92" y="25" width="32" height="105" rx="8" fill="#059669"/>
      <rect x="138" y="0" width="32" height="130" rx="8" fill="url(#seoGrad)"/>
      <!-- Growth Arrow Curve -->
      <path d="M16,60 Q80,20 154,-15" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
      <polygon points="160,-22 145,-12 152,-3" fill="#34d399"/>
    </g>
  </g>

  <!-- Left Content -->
  <g transform="translate(100, 150)">
    <!-- Pill -->
    <rect x="0" y="0" width="200" height="38" rx="19" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#10b981"/>
    <text x="35" y="24" fill="#34d399" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">SEARCH VISIBILITY</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Search Engine
    </text>
    <text x="0" y="150" fill="url(#seoGrad)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Optimization (SEO)
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Keyword research, technical audits, backlink strategy &amp; ranking
    </text>

    <!-- Signature Bar -->
    <line x1="0" y1="270" x2="480" y2="270" stroke="#1e293b" stroke-width="2"/>
    <g transform="translate(0, 290)">
      <text x="0" y="18" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">TECHBOUND</text>
      <text x="125" y="18" fill="#10b981" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600">INNOVATIONS</text>
      <text x="260" y="18" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">techbound.in</text>
    </g>
  </g>
</svg>
