<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="smmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#091819"/>
    </linearGradient>
    <linearGradient id="smmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="smmGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="smmGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.035"/>
      <circle cx="40" cy="40" r="1.5" fill="#ec4899" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#smmBg)"/>
  <rect width="1200" height="630" fill="url(#smmGlow)"/>
  <rect width="1200" height="630" fill="url(#smmGrid)"/>

  <!-- Right Graphic: Social Engagement Hub -->
  <g transform="translate(860, 140)">
    <!-- Central Engagement Bubble -->
    <rect x="0" y="20" width="160" height="130" rx="28" fill="#1e1838" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Heart Icon -->
    <path d="M80,60 C75,50 60,45 50,55 C38,67 50,85 80,105 C110,85 122,67 110,55 C100,45 85,50 80,60 Z" fill="url(#smmGrad)"/>
    
    <!-- Orbiting Bubbles -->
    <g transform="translate(-40, -10)">
      <circle cx="20" cy="30" r="28" fill="#0c1e28" stroke="#06b6d4" stroke-width="1.5"/>
      <!-- Share lines icon -->
      <circle cx="16" cy="30" r="3" fill="#06b6d4"/>
      <circle cx="26" cy="24" r="3" fill="#06b6d4"/>
      <circle cx="26" cy="36" r="3" fill="#06b6d4"/>
      <line x1="16" y1="30" x2="26" y2="24" stroke="#06b6d4" stroke-width="1.5"/>
      <line x1="16" y1="30" x2="26" y2="36" stroke="#06b6d4" stroke-width="1.5"/>
    </g>

    <g transform="translate(140, 100)">
      <circle cx="20" cy="30" r="24" fill="#280c1e" stroke="#ec4899" stroke-width="1.5"/>
      <!-- Message bubble icon -->
      <rect x="11" y="22" width="18" height="12" rx="3" fill="#ec4899"/>
      <polygon points="14,34 14,37 18,34" fill="#ec4899"/>
    </g>
  </g>

  <!-- Left Content -->
  <g transform="translate(100, 150)">
    <!-- Pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#ec4899" fill-opacity="0.18" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#ec4899"/>
    <text x="35" y="24" fill="#f472b6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">SOCIAL &amp; AUDIENCE</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Social Media &amp;
    </text>
    <text x="0" y="150" fill="url(#smmGrad)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Brand Engagement
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Instagram, LinkedIn, Meta Ads, viral content &amp; community building
    </text>

    <!-- Signature Bar -->
    <line x1="0" y1="270" x2="480" y2="270" stroke="#1e293b" stroke-width="2"/>
    <g transform="translate(0, 290)">
      <text x="0" y="18" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">TECHBOUND</text>
      <text x="125" y="18" fill="#ec4899" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600">INNOVATIONS</text>
      <text x="260" y="18" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">techbound.in</text>
    </g>
  </g>
</svg>
