<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c14"/>
      <stop offset="50%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#081e18"/>
    </linearGradient>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="webGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="webGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.035"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#webBg)"/>
  <rect width="1200" height="630" fill="url(#webGlow)"/>
  <rect width="1200" height="630" fill="url(#webGrid)"/>

  <!-- Right Graphic: Code Window & Wireframe -->
  <g transform="translate(850, 140)">
    <!-- Browser Window Card -->
    <rect x="0" y="0" width="240" height="170" rx="16" fill="#0c1829" stroke="#3b82f6" stroke-width="1.8" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="240" height="34" rx="16" fill="#13243a"/>
    <!-- Window buttons -->
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="5" fill="#10b981"/>
    <!-- Code Brackets in Editor -->
    <g transform="translate(30, 55)">
      <path d="M35,15 L15,35 L35,55" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M55,10 L45,60" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M65,15 L85,35 L65,55" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Mini UI Wireframe Lines -->
    <rect x="30" y="130" width="80" height="8" rx="4" fill="#38bdf8" fill-opacity="0.4"/>
    <rect x="120" y="130" width="50" height="8" rx="4" fill="#10b981" fill-opacity="0.4"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(100, 150)">
    <!-- Pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#3b82f6"/>
    <text x="35" y="24" fill="#60a5fa" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">WEB &amp; PLATFORMS</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Modern Website &amp;
    </text>
    <text x="0" y="150" fill="url(#webGrad)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Conversion Tech
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
      Speed, responsive UI architecture, UX design &amp; high conversions
    </text>

    <!-- Signature Bar -->
    <line x1="0" y1="270" x2="480" y2="270" stroke="#1e293b" stroke-width="2"/>
    <g transform="translate(0, 290)">
      <text x="0" y="18" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">TECHBOUND</text>
      <text x="125" y="18" fill="#3b82f6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600">INNOVATIONS</text>
      <text x="260" y="18" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">techbound.in</text>
    </g>
  </g>
</svg>
